services:

  todoapp:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/todoapp/Dockerfile
    container_name: todoapp
    environment:
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - POSTGRES_HOST=todoapp-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - TIME_ZONE=${TIME_ZONE}
      - LOGGER_FOLDER=/app/out/logs
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    expose:
      - "5050"
    restart: always

  auth-gateway:
    build:
      context: ${PROJECT_ROOT}/auth-gateway
      dockerfile: ${PROJECT_ROOT}/auth-gateway/Dockerfile
    container_name: todoapp-auth-gateway
    environment:
      - HTTP_ADDR=:8080
      - UPSTREAM=http://todoapp:5050
      - AUTH_USERNAME=${AUTH_USERNAME}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY}
      - COOKIE_SECURE=${COOKIE_SECURE}
    depends_on:
      - todoapp
    restart: always

  todoapp-postgres:
    image: postgres:18.1-bookworm
    container_name: todoapp-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./out/pgdata:/var/lib/postgresql # - ${PROJECT_ROOT}/out/pgdata вместо ./out/pgdata для Linux
    restart: always
  
  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations # - ${PROJECT_ROOT}/migrations вместо ./migrations для Linux

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoapp-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-postgres:5432 # поддержка двунаправленного сетевого трафика (проброс сетевого трафика изнутри докер контейнера с postgres на порт сервиса port-forwarder)
    ports:
      - "127.0.0.1:5432:5432" # проброс порта сервиса port-forwarder на порт хоста системы с доступом только с localhost

  swagger:
    build:
      context: ${PROJECT_ROOT}
      dockerfile_inline: |
        FROM golang:1.26.4-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${PROJECT_ROOT}:/code

  caddy:
    image: caddy:2.10
    container_name: todoapp-caddy
    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ${PROJECT_ROOT}/auth-gateway/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - auth-gateway

volumes:
  caddy_data:
  caddy_config: